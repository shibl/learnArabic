<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f8b8d">
<title>Huroof · حروف</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#fbf3e4;--sand2:#f3e6cc;--ink:#2b2118;--teal:#0f8b8d;--teal2:#0b6e70;--coral:#ef6f5c;--sun:#f6b93b;--leaf:#4caf6d;--muted:#8a7a66;--card:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--sand);color:var(--ink);font:500 18px/1.35 "Baloo Bhaijaan 2",system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.ar{font-family:"Baloo Bhaijaan 2",serif;direction:rtl;unicode-bidi:isolate}
#app{max-width:820px;margin:0 auto;min-height:100%;padding:12px 16px 32px;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;min-height:52px}
.bar .sp{flex:1}
.ib{border:0;background:var(--card);width:48px;height:48px;border-radius:16px;font-size:24px;box-shadow:0 3px 0 var(--sand2);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ib:active{transform:translateY(2px);box-shadow:none}
.chip{background:var(--card);border-radius:99px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 var(--sand2);white-space:nowrap}
h1,h2{margin:8px 0;line-height:1.1}
h1{font-size:34px} h2{font-size:26px}
.btn{border:0;background:var(--teal);color:#fff;font:800 22px "Baloo Bhaijaan 2";padding:14px 26px;border-radius:20px;box-shadow:0 5px 0 var(--teal2);cursor:pointer;min-height:60px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal2)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--sand2)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #c98f1d}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;flex:1}
.grid{display:grid;gap:14px}
.profiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));width:100%}
.prof{background:var(--card);border-radius:24px;padding:18px 10px;text-align:center;box-shadow:0 5px 0 var(--sand2);cursor:pointer;border:0;font:inherit;color:inherit}
.prof .av{font-size:56px}
.prof .nm{font-weight:800;font-size:22px}
.prof.add{border:3px dashed var(--sand2);box-shadow:none;background:transparent}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.avs button{font-size:38px;background:var(--card);border:3px solid transparent;border-radius:18px;width:66px;height:66px;cursor:pointer}
.avs button.on{border-color:var(--teal)}
input.name{font:700 26px "Baloo Bhaijaan 2";padding:10px 16px;border-radius:16px;border:3px solid var(--sand2);text-align:center;width:min(320px,100%);background:#fff;color:var(--ink)}
/* map */
.map{display:flex;flex-direction:column;gap:18px;padding:10px 0}
.island{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:14px 18px;box-shadow:0 5px 0 var(--sand2);border:0;font:inherit;color:inherit;text-align:start;cursor:pointer;position:relative}
.island:nth-child(even){margin-left:12%}.island:nth-child(odd){margin-right:12%}
.island .e{font-size:52px}
.island .t{font-weight:800;font-size:22px}
.island .ls{font-size:30px;letter-spacing:6px}
.island .st{position:absolute;top:-10px;right:14px;background:var(--sun);border-radius:99px;padding:0 10px;font-weight:800;font-size:15px}
.island.locked{opacity:.45;filter:grayscale(1);cursor:default}
.letters{grid-template-columns:repeat(2,1fr)}
.lt{background:var(--card);border-radius:28px;padding:10px;box-shadow:0 5px 0 var(--sand2);border:0;cursor:pointer;font:inherit;color:inherit}
.lt .c{font-size:96px;line-height:1.2;color:var(--teal)}
.lt .s{font-size:20px;color:var(--sun);letter-spacing:2px;min-height:26px}
/* lesson */
.big{font-size:min(44vw,220px);line-height:1.1;color:var(--teal);background:var(--card);border-radius:36px;padding:0 40px;box-shadow:0 6px 0 var(--sand2);cursor:pointer;border:0;font-family:"Baloo Bhaijaan 2"}
.words{grid-template-columns:repeat(3,1fr);width:100%}
.word{background:var(--card);border-radius:22px;padding:10px 6px;box-shadow:0 4px 0 var(--sand2);border:0;cursor:pointer;font:inherit;color:inherit}
.word .em{font-size:46px}
.word .w{font-size:28px;font-weight:700}
.word .w b{color:var(--coral)}
.word .tr{font-size:15px;color:var(--muted)}
.word .home{font-size:13px;color:var(--teal2);margin-top:2px}
.forms{grid-template-columns:repeat(4,1fr);width:100%;direction:rtl}
.form{background:var(--card);border-radius:20px;padding:8px 4px;box-shadow:0 4px 0 var(--sand2)}
.form .f{font-size:64px;line-height:1.25;color:var(--teal)}
.form .l{font-size:14px;color:var(--muted);direction:ltr}
.hint{color:var(--muted);font-size:16px;max-width:36ch}
.prog{height:14px;background:var(--sand2);border-radius:99px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.q{font-size:24px;font-weight:700}
.prompt{font-size:96px;line-height:1.1}
.opts{grid-template-columns:repeat(2,1fr);width:100%;max-width:520px}
.opt{background:var(--card);border-radius:26px;border:0;box-shadow:0 5px 0 var(--sand2);font:700 76px/1.3 "Baloo Bhaijaan 2";color:var(--ink);cursor:pointer;padding:6px}
.opt.good{background:var(--leaf);color:#fff;box-shadow:0 5px 0 #2f7d4a;animation:pop .35s}
.opt.bad{background:#f4c6bd;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.trace{position:relative;width:min(88vw,360px);aspect-ratio:1;background:var(--card);border-radius:32px;box-shadow:0 6px 0 var(--sand2);touch-action:none}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:32px}
.stars{font-size:64px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.family{background:#fff7e6;border:3px dashed var(--sun);border-radius:22px;padding:14px 18px;max-width:520px;font-size:17px;text-align:start}
.family b{display:block;font-size:19px}
.hud{display:flex;align-items:flex-end;gap:10px}
.hud svg{width:84px;height:84px;flex:none}
.bubble{background:var(--card);border-radius:20px 20px 20px 4px;padding:10px 14px;box-shadow:0 3px 0 var(--sand2);font-weight:700;text-align:start}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti span{position:absolute;top:-40px;font-size:30px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:15px;z-index:10;max-width:90vw;text-align:center}
/* parent */
.pcard{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--sand2);text-align:start}
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:rtl}
.pgrid div{background:var(--sand);border-radius:10px;text-align:center;font-size:24px;padding:2px 0}
.pgrid div.done{background:#d8f0df}
.kv{display:flex;gap:12px;flex-wrap:wrap}
.kv div{background:var(--sand);border-radius:14px;padding:6px 12px}
.kv b{font-size:22px;display:block}
.small{font-size:14px;color:var(--muted)}
a{color:var(--teal2)}
</style>
</head>
<body>
<div id="app"><div class="center"><h1>حُرُوف</h1><p>…</p></div></div>
<script src="app.js"></script>
</body>
</html>
