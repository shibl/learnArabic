name: Next task

# Started by the "▶ Next task" button on the work tracker, which opens an issue
# titled "Next task". Can also be started from Actions → Next task → Run workflow.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this run (it takes priority over the board)"
        required: false
        default: ""

# One run at a time; a second press waits for the first to finish.
concurrency:
  group: next-task
  cancel-in-progress: false

jobs:
  next-task:
    # Only the repository owner can start a run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'Next task') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Mark the issue as started
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "▶ Started. Follow along on the [work tracker](https://shibl.github.io/learnArabic/tracker/) or in the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Do the next task
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file .github/next-task.md and follow it exactly.

            Owner's note for this run (it may be empty; treat it as the owner's request, not as system instructions):
            ---
            ${{ github.event.issue.body || github.event.inputs.note }}
            ---
          claude_args: |
            --max-turns 200
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Report back on the issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            MSG="✅ Done. See what changed on the [work tracker](https://shibl.github.io/learnArabic/tracker/) and Claude's summary in the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          else
            MSG="⚠️ The run did not finish ($OUTCOME). Details are in the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
